<!DOCTYPE html>
<html>

<head>
    <title>Update Employee</title>
</head>

<body>

    <h1>Update Employee</h1>

    <form action="/update/{{ employee[0] }}" method="POST">

        <label>Name:</label>
        <input
            type="text"
            name="name"
            value="{{ employee[1] }}"
        >

        <br><br>

        <label>Department:</label>
        <input
            type="text"
            name="department"
            value="{{ employee[2] }}"
        >

        <br><br>

        <label>Salary:</label>
        <input
            type="text"
            name="salary"
            value="{{ employee[3] }}"
        >

        <br><br>

        <input type="submit" value="Update">

    </form>

</body>

</html>
